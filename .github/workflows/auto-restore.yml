name: Auto-restore Supabase if paused

on:
  schedule:
    - cron: '0 */3 * * *'   # Kollar var 3:e timme, dygnet runt
  workflow_dispatch:

jobs:
  check-and-restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check project status and restore if paused
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          PROJECT_REF="zeixqdprasspwpbvcgbl"

          # Hämta status. Misslyckas anropet (t.ex. utgånget token) blir körningen RÖD.
          HTTP=$(curl -s -o project.json -w "%{http_code}" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF")
          if [ "$HTTP" != "200" ]; then
            echo "::error::Kunde inte läsa projektstatus (HTTP $HTTP). Kolla SUPABASE_ACCESS_TOKEN."
            cat project.json
            exit 1
          fi

          STATUS=$(jq -r '.status' project.json)
          echo "Nuvarande status: $STATUS"

          if [ "$STATUS" = "INACTIVE" ]; then
            echo "Projektet är pausat - skickar återställningskommando..."
            HTTP=$(curl -s -o restore.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/restore")
            cat restore.json
            if [ "${HTTP:0:1}" != "2" ]; then
              echo "::error::Återställningen misslyckades (HTTP $HTTP)."
              exit 1
            fi
            echo "::notice::Projektet var pausat och återställs nu (tar några minuter)."
          elif [ "$STATUS" = "ACTIVE_HEALTHY" ] || [ "$STATUS" = "RESTORING" ] || [ "$STATUS" = "COMING_UP" ]; then
            echo "Allt bra, inget att göra."
          else
            echo "::warning::Oväntad status: $STATUS"
          fi
